# ============================================================
# KisanFlow AI — Render.com Infrastructure Blueprint
# Single-Service Free Deployment:
#   - Monorepo container: builds React frontend and serves via FastAPI
#   - No external databases required (uses SQLite)
# ============================================================

services:
  - type: web
    name: kisanflow-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: FIREWORKS_API_KEY
        sync: false           # Set manually in Render dashboard
      - key: DEMO_MODE
        value: false          # Set to true for live demos to bypass API calls
      - key: PORT
        value: 8000
